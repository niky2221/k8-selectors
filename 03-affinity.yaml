kind: Pod
apiVersion: v1
metadata: 
  name: affinity
  labels:
    purpose: affinity-demo
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: hardware
            operator: In
            values:
            - gpu            # if give aaffinity we must label nodes also with hardware=gpu
                             # ("kubectl label nodes ip-192-268-42-32-ec2 hardware=gpu")
  containers:
  - name: nginx
    image: nginx
  tolerations:
  - key: "gpu"
    operator: "Equal"
    value: "hardware"
    effect: "NoSchedule"         #taint nodes are given gpu=hardware ("kubectl taint nodes ip-192-268-42-32-ec2 gpu=hardware:NoSchedule")

