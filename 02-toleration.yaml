kind: Pod
apiVersion: v1
metadata: 
  name: taint
  labels:
    purpose: taint-demo
spec:
  nodeSelector:
    kubernetes.io/hostname: ip-192-168-42-200.ec2.internal
  containers:
  - name: nginx
    image: nginx
  tolerations:
  - key: "gpu"
    operator: "Equal"
    value: "hardware"
    effect: "NoSchedule"
