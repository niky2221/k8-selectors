kind: Pod
apiVersion: v1
metadata:
  name: pod1
  labels:
    purpose: pod-affinity
spec:
  containers:
  - name: nginx
    image: nginx
---
kind: Pod
apiVersion: v1
metadata:
  name: pod2
  labels:
    purpose: pod-affinity2
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app-name
            operator: In
            values:
            - pod1
        topologyKey: topology.kubernetes.io/zone
  containers:
  - name: nginx
    image: nginx


